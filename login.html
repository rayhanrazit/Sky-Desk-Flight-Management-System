<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyDesk - Log in</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="navbar">
        <div style="display: flex; align-items: center; gap: 24px;">
            <a href="login.html" class="brand">SkyDesk</a>
            <div class="nav-links">
                
                
            </div>
        </div>

        <div class="nav-actions">
            
            <a href="signup.html" class="btn-nav-all">Sign up</a>
        </div>
    </div>

    <div class="container">
        <h1 class="page-title">Welcome back</h1>
        <p class="page-subtitle">Log in to manage your tickets and bookings.</p>

        <div class="form-card">
            <form id="loginForm" action="flights.html" method="get" onsubmit="return validateLogin()">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="text" id="loginEmail" name="email">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password">
                </div>

                <div class="row-between">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <p id="loginError" class="error-msg"></p>


                <button  type="submit" class="btn-submit" >Log in</button>


                <p class="switch-text">
                    New to SkyDesk? <a href="signup.html">Create an account</a>
                </p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
